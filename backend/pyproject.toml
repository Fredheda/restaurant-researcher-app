[project]
name = "restaurant-researcher-backend"
version = "0.1.0"
description = "API and agent apps for the restaurant researcher"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.50.0",
    "httpx==0.28.1",
    "mssql-python (==1.12.0)",
    "copilotkit (==0.1.94)",
    "ag-ui-langgraph (==0.0.42)",
    "langchain (==1.3.9)",
    "langchain-openai (==1.3.3)",
    "langgraph (==1.2.19)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
ruff = "0.17.2"
pyright = "1.1.414"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
