name: Security

# Pull requests run only the two fast blocking checks (gitleaks, workflow-lint).
# The dependency audit runs on the weekly schedule, because advisories appear
# without any code change. Nothing runs on a merge to main: the PR already ran
# the same checks.
on:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

# A new push to the same PR cancels the run that is still going. Scheduled
# runs are never cancelled.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Blocks the PR. Runs the pinned gitleaks image directly: the gitleaks
  # action needs a license key for organization repos.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # PRs scan only the commits they add; the weekly run scans the whole
      # history.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          log_opts=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            log_opts=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose "${log_opts[@]}"

  # Blocks the PR. Lints the workflow files with the pinned actionlint image.
  workflow-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # Weekly only, and it fails visibly: a new advisory against an old
  # dependency must not fail an unrelated PR.
  npm-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Match frontend/Dockerfile.
      - run: npm install -g npm@12.2.2
      - run: npm audit --omit=dev --audit-level=high
