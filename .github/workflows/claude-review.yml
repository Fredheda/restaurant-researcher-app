name: Claude Review

# Reviews a PR when it opens and on every push to it, and again whenever the
# repo owner comments `@claude` on it. Each run draws on the Claude
# subscription usage limit; the per-PR concurrency group cancels a review that
# a newer push has made stale.

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Fork and bot-authored PRs get no repo secrets, so skip them instead of
    # failing on authentication.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    # Set per job, not per workflow: Claude's own PR comments fire issue_comment
    # runs, and a workflow-level group lets those skipped runs cancel this one.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.
            Read CLAUDE.md first for the stack and conventions.

            About this repo: a Next.js 16 / React 19 / Tailwind 4 website for a
            restaurant research skill, with a stub chat and stub place data,
            deployed to Azure Container Apps. Look hard at: API keys or other
            secrets in client code (anything exposed through NEXT_PUBLIC_
            variables or bundled into the browser), dependency and Next.js
            config problems, and secrets or unsafe commands in deploy scripts.

            Check security first:
            - committed .env files, key files, or .pem files
            - hardcoded secrets, tokens, or connection strings
            - unsafe handling of user input
            - missing authentication or authorization checks

            Then check for obvious correctness bugs only. Do not comment on
            style or formatting: lint and type checks already run in CI.

            Report only issues you are confident about, with file and line.
            If you find no security issues, say "No security issues found."
            explicitly. Do not invent findings.

            Post code-specific findings as inline comments, then one summary
            comment with `gh pr comment`.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  claude:
    # Only the repo owner can ask for a re-review, and only on a PR.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER'
    concurrency:
      group: claude-mention-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
