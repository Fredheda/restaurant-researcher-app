name: CI

# Run the same checks locally with scripts/ci-local.sh before `gh pr ready`.
#
# Runs on pull requests only: a merge to main starts no run, because the PR
# already ran the same checks. A draft PR runs only the light jobs (changes,
# checks); the build runs once the PR is ready for review. A newer push to the
# same PR cancels the run that is still going. CI never builds or deploys an
# image: the manual Deploy workflow (deploy.yml) does that.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # The checkout is the PR merge commit; its first parent is the base tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Docs-only means every changed file is *.md or under docs/.
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Light: tests, lint and type-check, on every push to a draft or ready PR.
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Deploy script tests
        working-directory: .
        run: ./scripts/tests/test-deploy-scripts.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Match frontend/Dockerfile.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit

  # Heavy: the production build, only once the PR is ready for review.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm run build
