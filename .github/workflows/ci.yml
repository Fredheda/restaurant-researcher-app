name: CI

# Run the same checks locally with scripts/ci-local.sh before `gh pr ready`.
#
# Runs on pull requests only: a merge to main starts no run, because the PR
# already ran the same checks. A draft PR runs only the light jobs (changes,
# backend, checks); the build runs once the PR is ready for review. A newer push to the
# same PR cancels the run that is still going. CI never builds or deploys an
# image: the manual Deploy workflow (deploy.yml) does that.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # The checkout is the PR merge commit; its first parent is the base tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Docs-only means every changed file is *.md or under docs/.
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Light: backend tests, lint, format and types, on every push to a draft or
  # ready PR.
  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-interaction
      - run: poetry run pytest -q
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pyright

  # Light: tests, lint and type-check, on every push to a draft or ready PR.
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy script tests
        working-directory: .
        run: ./scripts/tests/test-deploy-scripts.sh
      - name: Supply-chain guard
        working-directory: .
        run: ./scripts/tests/test-supply-chain.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Match frontend/Dockerfile.
      - run: npm install -g npm@12.2.2
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit

  # Heavy: the production build and the browser tests, only once the PR is
  # ready for review.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@12.2.2
      - run: npm ci
      - run: npm run build
      # Browser tests against the production build, offline (Chromium only).
      - id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
